package:
  name: ace
  authors:
    - "Aleksi Korsman <aleksi.korsman@aalto.fi>"
    - "Riccardo Tedeschi <riccardo.tedeschi6@unibo.it>"

dependencies:
  axi:               { git: "https://github.com/pulp-platform/axi.git", rev: 37fa3a93 } # branch: rt/ace
  common_cells:      { git: "https://github.com/pulp-platform/common_cells.git", version: 1.38.0 }
  axi_riscv_atomics: { git: "https://github.com/pulp-platform/axi_riscv_atomics.git", version: 0.8.2}

export_include_dirs:
  - include

sources:
  # Source files grouped in levels. Files in level 0 have no dependencies on files in this
  # package. Files in level 1 only depend on files in level 0, files in level 2 on files in
  # levels 1 and 0, etc. Files within a level are ordered alphabetically.
  # Level 0
  - src/ace_pkg.sv
  # Level 1
  - src/ace_intf.sv
  - src/snoop_intf.sv
  # ACE ips
  - src/ace_cut.sv
  - src/ace_snoop_cut.sv
  # CCU src files
  - src/ccu/ace_ccu_pkg.sv
  - src/ccu/ace_ccu_ax_arbiter.sv
  - src/ccu/ace_ccu_cd_arbiter.sv
  - src/ccu/ace_ccu_cd_ctrl.sv
  - src/ccu/ace_ccu_frontend.sv
  - src/ccu/ace_ccu_read.sv
  - src/ccu/ace_ccu_snoop_pipe.sv
  - src/ccu/ace_ccu_tracker.sv
  - src/ccu/ace_ccu_write.sv
  - src/ccu/ace_ccu_top.sv



