line-length=length:100
# The regex arm admits the lowerCamelCase this codebase uses; it is ORed with
# the built-in styles, which have no such choice. To be dropped once the
# parameters are converted to CamelCase
parameter-name-style=localparam_style:CamelCase|ALL_CAPS;parameter_style:CamelCase|ALL_CAPS;localparam_style_regex:[a-z][a-zA-Z0-9]*;parameter_style_regex:[a-z][a-zA-Z0-9]*
no-tabs
no-trailing-spaces
signal-name-style
